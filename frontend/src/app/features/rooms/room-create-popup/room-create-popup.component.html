<div class="popup-overlay">
  <button
    class="popup-backdrop"
    type="button"
    aria-label="Close create room dialog"
    [disabled]="creating()"
    (click)="close()"
  ></button>
  <section
    class="create-room-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="create-room-title"
  >
    <header class="popup-heading">
      <div>
        <p class="page-eyebrow">New conversation</p>
        <h2 id="create-room-title">Create room</h2>
      </div>
      <button
        class="icon-button"
        type="button"
        aria-label="Close create room dialog"
        [disabled]="creating()"
        (click)="close()"
      >
        <i class="pi pi-times" aria-hidden="true"></i>
      </button>
    </header>

    <form class="create-room-form" [formGroup]="createRoomForm" (ngSubmit)="submit()">
      <div class="field">
        <label for="room-name">Room name</label>
        <input
          class="editorial-input"
          id="room-name"
          formControlName="name"
          maxlength="50"
          placeholder="Room name"
          required
        />
        @if (createRoomForm.controls.name.invalid && createRoomForm.controls.name.touched) {
          <span class="field__error">{{ roomNameError() }}</span>
        }
      </div>

      <div class="field">
        <label for="room-visibility">Visibility</label>
        <select class="editorial-input" id="room-visibility" formControlName="visibility">
          <option value="public">Public</option>
          <option value="private">Private</option>
        </select>
      </div>

      @if (isPrivateRoomSelected()) {
        <div class="field">
          <label for="room-password">Room password</label>
          <input
            class="editorial-input"
            id="room-password"
            type="password"
            formControlName="password"
            maxlength="100"
            autocomplete="new-password"
            placeholder="At least 8 characters"
          />
          @if (
            createRoomForm.controls.password.invalid && createRoomForm.controls.password.touched
          ) {
            <span class="field__error">{{ roomPasswordError() }}</span>
          }
        </div>
      }

      <footer class="popup-actions">
        <button class="text-button" type="button" [disabled]="creating()" (click)="close()">
          Cancel
        </button>
        <button class="solid-button" type="submit" [disabled]="creating()">
          {{ creating() ? 'Creating...' : 'Create room' }}
        </button>
      </footer>
    </form>
  </section>
</div>
