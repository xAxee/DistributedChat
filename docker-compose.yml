name: distributed-chat

x-backend-build: &backend-build
  context: .
  dockerfile: backend/src/DistributedChat.Api/Dockerfile
  target: runtime

x-backend-environment: &backend-environment
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:8080
  Application__Name: DistributedChat
  ConnectionStrings__DistributedChat: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}
  Messaging__Transport: RabbitMq
  RabbitMq__HostName: rabbitmq
  RabbitMq__Port: 5672
  RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER}
  RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in the .env file}
  RabbitMq__VirtualHost: ${RABBITMQ_DEFAULT_VHOST}
  RabbitMq__ExchangeName: ${RABBITMQ_EXCHANGE_NAME}
  RabbitMq__PrefetchCount: ${RABBITMQ_PREFETCH_COUNT}
  Jwt__Issuer: ${JWT_ISSUER}
  Jwt__Audience: ${JWT_AUDIENCE}
  Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in the .env file}
  Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES}

services:
  postgres:
    image: postgres:18.1-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - distributed-chat-network

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in the .env file}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - distributed-chat-network

  migrations:
    image: distributed-chat-api:local
    build: *backend-build
    restart: "no"
    command: ["--migrate"]
    environment:
      <<: *backend-environment
      Instance__InstanceId: migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - distributed-chat-network

  chat-service-1:
    image: distributed-chat-api:local
    build: *backend-build
    restart: unless-stopped
    environment:
      <<: *backend-environment
      Instance__InstanceId: chat-service-1
    ports:
      - "${CHAT_SERVICE_1_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - distributed-chat-network

  chat-service-2:
    image: distributed-chat-api:local
    build: *backend-build
    restart: unless-stopped
    environment:
      <<: *backend-environment
      Instance__InstanceId: chat-service-2
    ports:
      - "${CHAT_SERVICE_2_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - distributed-chat-network

  angular:
    image: distributed-chat-angular:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      chat-service-1:
        condition: service_healthy
      chat-service-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - distributed-chat-network

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      angular:
        condition: service_healthy
      chat-service-1:
        condition: service_healthy
      chat-service-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - distributed-chat-network

volumes:
  postgres-data:
  rabbitmq-data:

networks:
  distributed-chat-network:
    driver: bridge
